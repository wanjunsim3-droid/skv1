<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배너 디자인 미리보기 (A, B, C)</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f0f0f0; margin: 0; padding: 20px; }
        .control-panel { background: #fff; padding: 20px; border-radius: 10px; margin-bottom: 50px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        .btn { padding: 10px 20px; margin: 5px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; background: #333; color: white; transition: 0.3s; }
        .btn:hover { background: #E2000F; }
        
        /* 공통 배경 시뮬레이션 */
        .mock-website { position: relative; width: 100%; height: 600px; background: url('images/banner.png') center/cover no-repeat; border: 3px solid #ccc; overflow: hidden; border-radius: 10px; }

        /* 옵션 A: 상단 띠 배너 */
        .banner-a { position: absolute; top: 0; left: 0; width: 100%; background: linear-gradient(90deg, #E2000F, #FF3B30); color: white; text-align: center; padding: 15px; font-weight: 700; font-size: 18px; z-index: 10; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .close-btn { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); background: none; border: none; color: white; font-size: 20px; cursor: pointer; }

        /* 옵션 B: 중앙 팝업 배너 */
        .banner-b { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 350px; background: white; border-radius: 15px; padding: 30px 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 10; display: none; border: 3px solid #E2000F; }
        .banner-b h3 { color: #E2000F; margin: 0 0 10px 0; font-size: 22px; font-weight: 800; }
        .banner-b p { color: #333; font-weight: 600; margin-bottom: 20px; }
        .banner-b .close-btn-b { background: #333; color: white; border: none; padding: 10px 30px; border-radius: 30px; font-weight: bold; cursor: pointer; }

        /* 옵션 C: 우측 하단 둥둥 배너 (전화버튼 위쪽) */
        .banner-c { position: absolute; bottom: 100px; right: 20px; width: 250px; background: #1A1A1A; color: #FFD700; padding: 15px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 10; font-weight: bold; display: none; text-align: center; border-left: 5px solid #E2000F; }
        
        /* 가짜 전화 버튼 (위치 참조용) */
        .fake-fab { position: absolute; bottom: 20px; right: 20px; width: 60px; height: 60px; background: #E2000F; border-radius: 50%; color: white; display: flex; justify-content: center; align-items: center; font-size: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        
    </style>
</head>
<body>

    <div class="control-panel">
        <h2>어떤 디자인이 가장 마음에 드시나요?</h2>
        <p>아래 버튼을 눌러 각 배너의 실제 화면 느낌을 미리 확인해 보세요.</p>
        <button class="btn" onclick="showBanner('a')">👀 옵션 A (상단 띠 배너)</button>
        <button class="btn" onclick="showBanner('b')">👀 옵션 B (화면 중앙 팝업)</button>
        <button class="btn" onclick="showBanner('c')">👀 옵션 C (우측 하단 풍선)</button>
    </div>

    <div class="mock-website">
        <!-- 옵션 A -->
        <div class="banner-a" id="banner-a">
            🎉 [특별 혜택] 국내 최대 입주 지원 프로모션 진행 중! 🎉
            <button class="close-btn" onclick="this.parentElement.style.display='none'"><i class="fas fa-times"></i></button>
        </div>

        <!-- 옵션 B -->
        <div class="banner-b" id="banner-b">
            <h3>특별 프로모션 🎉</h3>
            <p>국내 최대 입주 지원<br>프로모션이 진행 중입니다!</p>
            <button class="close-btn-b" onclick="this.parentElement.style.display='none'">닫기 (X)</button>
        </div>

        <!-- 옵션 C -->
        <div class="banner-c" id="banner-c">
            🎁 국내 최대 입주 지원!<br>프로모션 혜택 확인하기
            <button style="position:absolute; top:5px; right:5px; background:none; border:none; color:white; cursor:pointer;" onclick="this.parentElement.style.display='none'"><i class="fas fa-times"></i></button>
        </div>

        <!-- 가이드용 가짜 전화버튼 -->
        <div class="fake-fab"><i class="fas fa-phone"></i></div>
    </div>

    <script>
        function showBanner(type) {
            document.getElementById('banner-a').style.display = 'none';
            document.getElementById('banner-b').style.display = 'none';
            document.getElementById('banner-c').style.display = 'none';
            
            document.getElementById('banner-' + type).style.display = 'block';
        }
    </script>
</body>
</html>
